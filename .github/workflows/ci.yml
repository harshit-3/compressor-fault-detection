name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest httpx ruff matplotlib joblib lightgbm mlflow
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t compressor-pdm .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name api compressor-pdm
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          python3 -c "import json; w=json.load(open('tests/fixtures/windows.json')); json.dump({'readings': w['failure']}, open('req.json','w'))"
          curl -sf -X POST localhost:8000/score -H 'Content-Type: application/json' -d @req.json | tee out.json
          grep -q '"anomalous":true' out.json
