[project]
name = "compressor-pdm"
version = "1.0.0"
description = "Fault detection for mining-fleet compressors / air production units (MetroPT-3)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E402"]
